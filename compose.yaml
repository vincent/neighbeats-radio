# neighbeats-radio on the NAS next to neighbeats.
#
# One-time setup:
#   cp .env.example .env && cp config.example.yaml config.yaml    # then edit both
#   mkdir -p data spool fallback                                  # fallback: a few known-good tracks
#   docker compose up -d
# On a VPS only compose.yaml, .env, config.yaml and those folders are needed: both images
# (director and liquidsoap, with radio.liq baked in) come from ghcr.
#
# Stream: https://USER:PASS@${RADIO_HOST}/live.mp3 (see README for player notes).
#
# Port 8005 (control) is never published and has no Traefik router. Liquidsoap sits on
# `internal` (director) and on the Traefik network (stream only); anything else on the
# Traefik network could still reach 8005, so do not share that network with untrusted
# containers.

services:
  # Audio engine: plays tracks queued by the director (falls back to ./fallback),
  # serves the MP3 stream on :8000 via Traefik (basic auth + TLS). Control port 8005
  # stays internal-only. Music folder mounted read-only at the same path as Jellyfin.
  liquidsoap:
    build: ./liquidsoap
    image: ghcr.io/vincent/neighbeats-radio-liquidsoap:main
    command: ["/etc/liquidsoap/radio.liq"]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    volumes:
      # Same path as Jellyfin sees (path_map.remote in neighbeats' config): no translation.
      - type: bind
        source: ${MUSIC_PATH:?set MUSIC_PATH to the music folder, as Jellyfin sees it}
        target: ${MUSIC_PATH}
        read_only: true
      - ./fallback:/fallback:ro
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.radio.rule: Host(`${RADIO_HOST:?set RADIO_HOST}`)
      traefik.http.routers.radio.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.radio.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.radio.middlewares: radio-auth
      traefik.http.middlewares.radio-auth.basicauth.users: ${RADIO_BASICAUTH:?set RADIO_BASICAUTH}
      traefik.http.services.radio.loadbalancer.server.port: "8000"

  # Director: polls the queue, picks tracks via the neighbeats API (unix socket in
  # NEIGHBEATS_RUN) and pushes them to liquidsoap over the internal network.
  # Keeps state in ./data and staged audio in ./spool.
  neighbeats-radio:
    build: .
    image: ghcr.io/vincent/neighbeats-radio:main
    restart: unless-stopped
    depends_on:
      - liquidsoap
    command: ["-config", "/config/config.yaml", "run"]
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ./spool:/spool
      # neighbeats' run folder holds neighbeats.sock (its group must be ours, mode 0660).
      - ${NEIGHBEATS_RUN:-../neighbeats/run}:/run/neighbeats
    networks:
      - internal

networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
