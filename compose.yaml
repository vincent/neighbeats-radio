# neighbeats-radio on the NAS next to neighbeats.
#
# One-time setup:
#   cp .env.example .env && cp config.example.yaml config.yaml    # then edit both
#   mkdir -p data spool fallback                                  # fallback: a few known-good tracks
#   docker compose up -d
# On a VPS only compose.yaml, .env, config.yaml and those folders are needed: the director
# image comes from ghcr and radio.liq is embedded below (top-level `configs`, Compose >= 2.23.1).
#
# Stream: https://USER:PASS@${RADIO_HOST}/live.mp3 (see README for player notes).
#
# Port 8005 (control) is never published and has no Traefik router. Liquidsoap sits on
# `internal` (director) and on the Traefik network (stream only); anything else on the
# Traefik network could still reach 8005, so do not share that network with untrusted
# containers.

services:
  # Audio engine: plays tracks queued by the director (falls back to ./fallback),
  # serves the MP3 stream on :8000 via Traefik (basic auth + TLS). Control port 8005
  # stays internal-only. Music folder mounted read-only at the same path as Jellyfin.
  liquidsoap:
    image: savonet/liquidsoap:v2.4.6
    command: ["/etc/liquidsoap/radio.liq"]
    configs:
      - source: radio_liq
        target: /etc/liquidsoap/radio.liq
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    tmpfs:
      - /tmp
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp
    volumes:
      # Host folder mounted where Jellyfin sees it (MUSIC_PATH), so neighbeats' paths
      # are playable as they come, no translation.
      - type: bind
        source: ${MUSIC_HOST_PATH:?set MUSIC_HOST_PATH to the music folder on the host}
        target: ${MUSIC_PATH:?set MUSIC_PATH to the music folder as Jellyfin sees it}
        read_only: true
      - ./fallback:/fallback:ro
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.radio.rule: Host(`${RADIO_HOST:?set RADIO_HOST}`)
      traefik.http.routers.radio.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.radio.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.radio.middlewares: radio-auth
      traefik.http.middlewares.radio-auth.basicauth.users: ${RADIO_BASICAUTH:?set RADIO_BASICAUTH}
      traefik.http.services.radio.loadbalancer.server.port: "8000"

  # Director: polls the queue, picks tracks via the neighbeats API (unix socket in
  # NEIGHBEATS_RUN) and pushes them to liquidsoap over the internal network.
  # Keeps state in ./data and staged audio in ./spool.
  neighbeats-radio:
    build: .
    image: ghcr.io/vincent/neighbeats-radio:main
    restart: unless-stopped
    depends_on:
      - liquidsoap
    command: ["-config", "/config/config.yaml", "run"]
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ./spool:/spool
      # neighbeats' run folder holds neighbeats.sock (its group must be ours, mode 0660).
      - ${NEIGHBEATS_RUN:-../neighbeats/run}:/run/neighbeats
    networks:
      - internal

networks:
  internal:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

# The Liquidsoap script. Compose interpolates `$` here: write `$$` if one is ever needed.
configs:
  radio_liq:
    content: |
      # neighbeats-radio: Liquidsoap only plays. The director decides what is queued.
      #
      # Stream:  http://HOST:8000/live.mp3        (behind Traefik, basic auth there)
      # Control: http://liquidsoap:8005/control/* (internal only, never routed by Traefik)

      settings.log.level.set(3)
      settings.harbor.bind_addrs.set(["0.0.0.0"])

      control_port = 8005

      # --- sources -----------------------------------------------------------------

      # The director pushes absolute file paths here. Music is mounted at the same path
      # Jellyfin uses, so neighbeats' answers are playable as they come.
      music = request.queue(id="music")

      # Known-good tracks, used only when the music queue is empty.
      safe = playlist(mode="randomize", reload_mode="watch", "/fallback")

      # Last resort so the chain is never empty: a quiet tone.
      ident_loop = amplify(0.05, sine(440.))

      radio = fallback(track_sensitive=false, [music, safe, ident_loop])

      # --- what is playing ---------------------------------------------------------

      track_id = ref(0)
      current = ref([("filename", ""), ("artist", ""), ("title", "")])

      radio.on_track(synchronous=false, fun (m) -> begin
        track_id := track_id() + 1
        filename = m["filename"]
        artist = m["artist"]
        title = m["title"]
        current := [("filename", filename), ("artist", artist), ("title", title)]
        log("track #{track_id()}: #{artist} - #{title} (#{filename})")
      end)

      # --- control API -------------------------------------------------------------
      # Plain HTTP + JSON, so the Go side needs no telnet client.

      def reply_error(response, code, message)
        response.status_code(code)
        response.json({error = message})
      end

      # GET /control/status
      #   {"track_id": 7, "queued": 1, "current": {"filename": ..., "artist": ..., "title": ...}}
      # "queued" counts requests waiting behind the one playing.
      harbor.http.register(port=control_port, method="GET", "/control/status", fun (_, response) -> begin
        response.json({
          track_id = track_id(),
          queued = list.length(music.queue()),
          current = {
            filename = list.assoc(default="", "filename", current()),
            artist = list.assoc(default="", "artist", current()),
            title = list.assoc(default="", "title", current())
          }
        })
      end)

      # POST /control/push   body: an absolute path (raw text, no quoting)
      harbor.http.register(port=control_port, method="POST", "/control/push", fun (req, response) -> begin
        path = string.trim(req.body())
        if path == "" or string.sub(path, start=0, length=1) != "/" then
          reply_error(response, 400, "body must be an absolute path")
        elsif not file.exists(path) then
          reply_error(response, 404, "no such file: #{path}")
        else
          music.push(request.create(path))
          response.json({pushed = path, queued = list.length(music.queue())})
        end
      end)

      # POST /control/skip
      harbor.http.register(port=control_port, method="POST", "/control/skip", fun (_, response) -> begin
        music.skip()
        safe.skip()
        response.json({skipped = true})
      end)

      # POST /control/flush: drop everything waiting in the music queue (not the current track).
      harbor.http.register(port=control_port, method="POST", "/control/flush", fun (_, response) -> begin
        music.set_queue([])
        response.json({queued = 0})
      end)

      # --- output ------------------------------------------------------------------

      output.harbor(id="stream", %mp3(bitrate=192), mount="live.mp3", port=8000, radio)
