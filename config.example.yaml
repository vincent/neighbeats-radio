# Copy to config.yaml. Unknown keys are rejected. Every key shown is optional;
# the values below are the defaults.
liquidsoap:
  control_url: http://liquidsoap:8005   # internal harbor, never behind Traefik
  timeout: 5s

neighbeats:
  socket: /run/neighbeats/neighbeats.sock
  user: ""                              # Jellyfin user whose taste steers; empty = neighbeats' jellyfin.user
  timeout: 30s

director:
  mode: comfort          # comfort | explore | rediscover | none
  leg_min: 8             # tracks per leg, drawn between min and max
  leg_max: 15
  max_minutes: 10        # leave out tracks longer than this
  look_ahead: 20m        # keep this much planned
  repeat_window: 8h      # no recording twice inside this window
  poll_interval: 2s
  assumed_track: 4m      # used for tracks neighbeats reports no duration for
  push_when_below: 4     # items Liquidsoap holds
  # Optional fallback destinations when /v1/pick fails or is missing. Paths as Jellyfin sees them.
  seed_paths: []
  # Crossfade length by hop cosine: >= close_at blends long, < far_at is a short clean fade.
  fades:
    close: 8s
    mid: 5s
    far: 1500ms
    close_at: 0.8
    far_at: 0.5

# Spoken breaks between tracks (Piper, English). Needs the voice in the image or in ./models.
voice:
  enabled: false
  piper: /opt/piper/piper
  model: /opt/piper/voice.onnx         # or /models/other.onnx (mount ./models)
  dir: /spool/voice                    # shared with Liquidsoap
  timeout: 8s                          # a sentence slower than this is dropped, music unaffected
  templates: ""                        # folder with between/hour/steer/leg.tmpl; empty = built-in
  every_min: 4                         # a break every 4-6 tracks, never twice in a row (every_min: 1 = after every track)
  every_max: 6
  hour_mark: true
  on_steer: true
  on_leg: true
  say: {}                              # {"Sigur Rós": "Sigur Ross"}: names Piper mangles

control:
  socket: /run/neighbeats-radio/neighbeats-radio.sock   # served by `run`, used by now/skip/steer/...
  timeout: 10s

data: /data              # holds neighbeats-radio.sqlite
